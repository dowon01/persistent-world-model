# 수백 스텝 안에 끝나는 디버그 설정 (작은 데이터, 작은 모델)
name: debug
data_dir: data/debug
out_dir: outputs/debug
seed: 0
model:
  context: 4
  channels: [32, 64, 64, 64]
  blocks: 1
  cond_dim: 64
train:
  steps: 300
  batch: 16
  lr: 5.0e-4
  warmup: 20
  weight_decay: 0.0
  grad_clip: 1.0
  l1_weight: 1.0
  unroll: 2
  ctx_noise: 0.05
  log_every: 50
  eval_every: 150
  ckpt_every: 300
eval:
  horizons: [1, 5, 10]
  rollout_len: 10
  num_rollouts: 8
